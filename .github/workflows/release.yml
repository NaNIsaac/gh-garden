# Tag v* → binaries named the way `gh extension install` looks for them.
# Windows + Linux; add macOS targets when they can be tested.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: gh-garden-windows-amd64.exe, bin: gh-garden.exe }
          - { os: ubuntu-latest, asset: gh-garden-linux-amd64, bin: gh-garden }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release
      - run: cargo build --release
      - name: Upload binary
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp "target/release/${{ matrix.bin }}" "${{ matrix.asset }}"
          gh release upload "$GITHUB_REF_NAME" "${{ matrix.asset }}" --clobber

  verify-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify both platform assets are present
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          printf '%s\n' "$assets" | grep -Fx 'gh-garden-windows-amd64.exe'
          printf '%s\n' "$assets" | grep -Fx 'gh-garden-linux-amd64'
